<!-- MiniChat 标记（启动画面用）
     设计说明：
       · 原来的 logo.svg 是「气泡 + 纸飞机 + MiniChat 字样」，曲线是描摹来的，轮廓略歪；
         而且缩到 16px 时那行字会糊成一团。
       · 这个版本【只重画了气泡】：圆角矩形 + 居中的下尖角，几何干净、对称；
         【纸飞机保持原样】—— 它本身的折翼细节很好，不动它就不会错位。
       · 原版那行字去掉：启动画面里它太小，反而糊；品牌名交给页面本身表达。
     坐标沿用原文件的坐标系，所以飞机路径可以原样复用。 -->
